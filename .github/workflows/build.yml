name: Build ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Locate and Run Build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dos2unix

          # ഫയൽ സിസ്റ്റം മുഴുവൻ തപ്പി build_final_iso.sh കണ്ടെത്തുന്നു
          TARGET=$(sudo find / -name "build_final_iso.sh" 2>/dev/null | grep "retro-os" | head -n 1)

          if [ -z "$TARGET" ]; then
            echo "Direct search fallback..."
            TARGET=$(find . -name "build_final_iso.sh" | head -n 1)
          fi

          echo "Found script at: $TARGET"
          DIR=$(dirname "$TARGET")
          cd "$DIR"

          # വിൻഡോസ് ഫോർമാറ്റ് മാറ്റി പെർമിഷൻ നൽകുന്നു
          dos2unix *.sh retro config.env 2>/dev/null || true
          chmod +x *.sh retro 2>/dev/null || chmod +x *.sh || true

          # റൂട്ട് ആയി സ്ക്രിപ്റ്റ് റൺ ചെയ്യുന്നു
          sudo bash build_final_iso.sh

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: Retro-OS-ISO
          path: "**/*.iso"

