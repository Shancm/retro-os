name: Build ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Debug and List Files
        run: |
          pwd
          ls -la

      - name: Run Build
        run: |
          chmod +x *.sh || true
          [ -f retro ] && chmod +x retro || true
          sudo bash ./build_final_iso.sh

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: Retro-OS-ISO
          path: "*.iso"
