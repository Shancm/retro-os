name: Build ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Setup and Build
        run: |
          # 1. ആവശ്യമായ ബിൽഡ് ടൂളുകളും isohybrid ബൈനറിയും നേരിട്ട് ഇൻസ്റ്റാൾ ചെയ്യുന്നു
          sudo apt-get update -qq
          sudo apt-get install -y -qq git dos2unix syslinux-utils isolinux xorriso mtools dosfstools

          # 2. റിപോസിറ്ററി ക്ലോൺ ചെയ്യുന്നു
          cd /home/runner
          rm -rf my-retro-build
          git clone --depth 1 https://github.com/Shancm/retro-os.git my-retro-build
          cd my-retro-build

          # 3. ഫോർമാറ്റിംഗ് ക്ലീൻ ചെയ്തു എക്സിക്യൂട്ട് പെർമിഷൻ നൽകുന്നു
          find . -type f -exec dos2unix -q {} + || true
          chmod -R +x .

          # 4. ബിൽഡ് സ്ക്രിപ്റ്റ് കണ്ടെത്തി റൺ ചെയ്യുന്നു
          BUILD_SCRIPT=$(ls | grep -i "build.*iso.*sh" | head -n 1)
          echo "Starting build with: $BUILD_SCRIPT"
          sudo bash "./$BUILD_SCRIPT"

          # 5. ഔട്ട്പുട്ട് ഫയൽ മൂവ് ചെയ്യുന്നു
          mkdir -p $GITHUB_WORKSPACE/output
          mv *.iso $GITHUB_WORKSPACE/output/ 2>/dev/null || true
          find . -maxdepth 2 -name "*.iso" -exec mv {} $GITHUB_WORKSPACE/output/ \; 2>/dev/null || true

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: Retro-OS-ISO
          path: output/*.iso
