name: Build ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare and Run Build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dos2unix

          # ഫയലുകളുടെ വിൻഡോസ് ലൈൻ എൻഡിങ് പൂർണ്ണമായി നീക്കം ചെയ്യുക
          find "$GITHUB_WORKSPACE" -type f -exec dos2unix -q {} + || true

          # സ്ക്രിപ്റ്റുകൾക്ക് പെർമിഷൻ നൽകുക
          find "$GITHUB_WORKSPACE" -type f -name "*.sh" -exec chmod +x {} + || true
          [ -f "$GITHUB_WORKSPACE/retro" ] && chmod +x "$GITHUB_WORKSPACE/retro" || true

          # build_final_iso.sh കിടക്കുന്ന ഫോൾഡർ കണ്ടെത്തി അവിടേക്ക് മാറി റൺ ചെയ്യുക
          ISO_SCRIPT=$(find "$GITHUB_WORKSPACE" -name "build_final_iso.sh" | head -n 1)
          if [ -z "$ISO_SCRIPT" ]; then
            echo "Error: build_final_iso.sh not found!"
            exit 1
          fi

          cd "$(dirname "$ISO_SCRIPT")"
          sudo bash "$ISO_SCRIPT"

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: Retro-OS-ISO
          path: "**/*.iso"
