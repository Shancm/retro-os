name: Build ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Files & Run Build
        run: |
          ls -la
          chmod +x *.sh || true
          [ -f retro ] && chmod +x retro || true
          sudo bash ./build_final_iso.sh

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: Retro-OS-ISO
          path: "*.iso"
