name: Build ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Setup and Build
        run: |
          # 1. ആവശ്യമായ എല്ലാ ടൂളുകളും ഇൻസ്റ്റാൾ ചെയ്യുന്നു
          sudo apt-get update -qq
          sudo apt-get install -y -qq git dos2unix isolinux xorriso mtools dosfstools squashfs-tools

          # 2. isohybrid ടൂൾ സിസ്റ്റം പാത്തിലേക്ക് ലിങ്ക് ചെയ്യുന്നു
          if [ -f /usr/lib/ISOLINUX/isohybrid ]; then
            sudo ln -sf /usr/lib/ISOLINUX/isohybrid /usr/local/bin/isohybrid
          else
            # xorriso-യുടെ isohybrid ഫീച്ചർ വഴി റാപ്പർ സ്ക്രിപ്റ്റ് ഉണ്ടാക്കുന്നു
            sudo tee /usr/local/bin/isohybrid > /dev/null << 'EOF'
          #!/bin/sh
          xorriso -as isolinux --isohybrid-mbr "$@"
          EOF
            sudo chmod +x /usr/local/bin/isohybrid
          fi

          # 3. പ്രോജക്ട് ക്ലോൺ ചെയ്യുന്നു
          cd /home/runner
          rm -rf my-retro-build
          git clone --depth 1 https://github.com/Shancm/retro-os.git my-retro-build
          cd my-retro-build

          # 4. ഫോർമാറ്റിംഗ് ശരിയാക്കി റൺ ചെയ്യുന്നു
          find . -type f -exec dos2unix -q {} + || true
          chmod -R +x .

          BUILD_SCRIPT=$(ls | grep -i "build.*iso.*sh" | head -n 1)
          echo "Starting build with: $BUILD_SCRIPT"
          sudo bash "./$BUILD_SCRIPT"

          # 5. ഔട്ട്പുട്ട് മാറ്റുന്നു
          mkdir -p $GITHUB_WORKSPACE/output
          find . -name "*.iso" -exec mv {} $GITHUB_WORKSPACE/output/ \; 2>/dev/null || true

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: Retro-OS-ISO
          path: output/*.iso

