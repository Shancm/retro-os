name: Build ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Setup and Build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git dos2unix isolinux xorriso mtools dosfstools squashfs-tools

          # isohybrid റാപ്പർ കൃത്യമായി ഉണ്ടാക്കുന്നു
          sudo bash -c 'cat << "EOF" > /usr/bin/isohybrid
          #!/bin/sh
          xorriso -as isolinux --isohybrid-mbr "$@"
          EOF'
          sudo chmod +x /usr/bin/isohybrid

          # പ്രോജക്ട് ക്ലോൺ ചെയ്യുന്നു
          cd /home/runner
          rm -rf my-retro-build
          git clone --depth 1 https://github.com/Shancm/retro-os.git my-retro-build
          cd my-retro-build

          # ഫയൽ ഫോർമാറ്റിംഗ് ശരിയാക്കുന്നു
          find . -type f -exec dos2unix -q {} + || true
          chmod -R +x .

          # ബിൽഡ് ആരംഭിക്കുന്നു
          BUILD_SCRIPT=$(ls | grep -i "build.*iso.*sh" | head -n 1)
          echo "Starting build with: $BUILD_SCRIPT"
          sudo bash "./$BUILD_SCRIPT"

          # ഔട്ട്പുട്ട് ഫയൽ മാറ്റുന്നു
          mkdir -p "$GITHUB_WORKSPACE/output"
          find . -name "*.iso" -exec mv {} "$GITHUB_WORKSPACE/output/" \; 2>/dev/null || true

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: Retro-OS-ISO
          path: output/*.iso
