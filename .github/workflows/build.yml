name: Build ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run Build
        run: |
          chmod +x *.sh retro
          sudo ./build_final_iso.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Retro-OS-ISO
          path: "*.iso"
