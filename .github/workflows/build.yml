name: Build ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dos2unix
          dos2unix *.sh retro config.env 2>/dev/null || true
          chmod +x *.sh retro 2>/dev/null || chmod +x *.sh || true
          sudo ./build_final_iso.sh

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: Retro-OS-ISO
          path: "*.iso"
