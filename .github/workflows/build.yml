name: Build ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Setup and Build
        run: |
          # 1. ആവശ്യമായ ടൂളുകൾ ഇൻസ്റ്റാൾ ചെയ്യുക
          sudo apt-get update -qq
          sudo apt-get install -y -qq git dos2unix

          # 2. ഏറ്റവും പുതിയ ഫയലുകൾ ഒരു പുതിയ ഫോൾഡറിലേക്ക് നേരിട്ട് ക്ലോൺ ചെയ്യുക
          cd /home/runner
          rm -rf my-retro-build
          git clone --depth 1 https://github.com/Shancm/retro-os.git my-retro-build
          cd my-retro-build

          # 3. ഫോർമാറ്റിംഗ് ശരിയാക്കി പെർമിഷൻ നൽകുക
          find . -type f -exec dos2unix -q {} + || true
          chmod +x *.sh || true
          [ -f retro ] && chmod +x retro || true

          # 4. നേരിട്ട് ISO നിർമ്മാണം ആരംഭിക്കുക
          echo "Starting ISO build inside $(pwd)..."
          sudo bash ./build_final_iso.sh

          # 5. ഉണ്ടാക്കിയ ISO ഫയൽ വർക്ക്‌സ്‌പേസിലേക്ക് മാറ്റുക
          mkdir -p $GITHUB_WORKSPACE/output
          mv *.iso $GITHUB_WORKSPACE/output/ 2>/dev/null || true

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: Retro-OS-ISO
          path: output/*.iso
