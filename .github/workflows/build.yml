name: Build ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Setup and Build
        run: |
          # 1. ആവശ്യമായ ബിൽഡ് ടൂളുകൾ ഇൻസ്റ്റാൾ ചെയ്യുന്നു
          sudo apt-get update -qq
          sudo apt-get install -y -qq git dos2unix isolinux xorriso mtools dosfstools squashfs-tools

          # 2. Ubuntu 24.04-ൽ ഇല്ലാത്ത syslinux-utils (isohybrid) പാക്കേജ് നേരിട്ട് ഡൗൺലോഡ് ചെയ്ത് ഇൻസ്റ്റാൾ ചെയ്യുന്നു
          wget -q http://archive.ubuntu.com/ubuntu/pool/main/s/syslinux/syslinux-utils_6.04~git20190207.7ef468e4+dfsg1-1ubuntu3_amd64.deb || \
          wget -q http://ftp.debian.org/debian/pool/main/s/syslinux/syslinux-utils_6.04~git20190207.7ef468e4+dfsg1-3_amd64.deb
          sudo dpkg -i --force-all syslinux-utils*.deb || true

          # 3. isohybrid ലഭ്യമാണെന്ന് ഉറപ്പുവരുത്തുന്നു
          which isohybrid || echo "isohybrid path: $(find / -name isohybrid 2>/dev/null)"

          # 4. പ്രോജക്ട് ക്ലോൺ ചെയ്യുന്നു
          cd /home/runner
          rm -rf my-retro-build
          git clone --depth 1 https://github.com/Shancm/retro-os.git my-retro-build
          cd my-retro-build

          # 5. ഫോർമാറ്റ് ക്ലീൻ ചെയ്ത് റൺ ചെയ്യുന്നു
          find . -type f -exec dos2unix -q {} + || true
          chmod -R +x .

          BUILD_SCRIPT=$(ls | grep -i "build.*iso.*sh" | head -n 1)
          echo "Starting build with: $BUILD_SCRIPT"
          sudo bash "./$BUILD_SCRIPT"

          # 6. പൂർത്തിയായ ISO മാറ്റുന്നു
          mkdir -p $GITHUB_WORKSPACE/output
          find . -name "*.iso" -exec mv {} $GITHUB_WORKSPACE/output/ \; 2>/dev/null || true

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: Retro-OS-ISO
          path: output/*.iso
