name: Build ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Setup and Build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git dos2unix

          cd /home/runner
          rm -rf my-retro-build
          git clone --depth 1 https://github.com/Shancm/retro-os.git my-retro-build
          cd my-retro-build

          echo "=== ലിസ്റ്റിലുള്ള ഫയലുകൾ പരിശോധിക്കുന്നു ==="
          ls -la

          # എല്ലാ ഫയലുകളിലെയും വിൻഡോസ് എൻഡിങ് മാറ്റുന്നു
          find . -type f -exec dos2unix -q {} + || true

          # .sh ഫയലുകൾക്ക് പെർമിഷൻ നൽകുന്നു
          chmod -R +x .

          # build എന്ന് പേരുള്ള സ്ക്രിപ്റ്റ് കണ്ടെത്തുന്നു
          BUILD_SCRIPT=$(ls | grep -i "build.*iso.*sh" | head -n 1)

          if [ -z "$BUILD_SCRIPT" ]; then
            echo "ബിൽഡ് സ്ക്രിപ്റ്റ് കണ്ടെത്താനായില്ല, ഫയലുകൾ താഴെ നൽകുന്നു:"
            ls -la
            exit 1
          fi

          echo "തിരഞ്ഞെടുത്ത സ്ക്രിപ്റ്റ്: $BUILD_SCRIPT"
          sudo bash "./$BUILD_SCRIPT"

          mkdir -p $GITHUB_WORKSPACE/output
          mv *.iso $GITHUB_WORKSPACE/output/ 2>/dev/null || true

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: Retro-OS-ISO
          path: output/*.iso

