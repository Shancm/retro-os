name: Build ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Clean Format and Run
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq dos2unix
          find . -type f -exec dos2unix -q {} + 2>/dev/null || true
          chmod +x *.sh retro 2>/dev/null || true
          sudo bash -c 'source ./build_final_iso.sh' || sudo bash ./build_final_iso.sh

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: Retro-OS-ISO
          path: "*.iso"

